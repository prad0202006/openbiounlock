name: OpenBioUnlock CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

jobs:
  build-daemon-and-pam:
    name: Build Rust daemon and Linux PAM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install --yes libpam0g-dev
      - name: Test and build daemon
        run: |
          cargo test --manifest-path daemon/Cargo.toml
          cargo build --release --manifest-path daemon/Cargo.toml
      - name: Build PAM module
        run: make -C linux-pam
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbiounlock-linux
          if-no-files-found: error
          path: |
            daemon/target/release/openbiounlock-daemon
            linux-pam/pam_openbiounlock.so

  build-desktop-linux:
    name: Build Linux Qt desktop and AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build pkg-config libssl-dev libsecret-1-dev qt6-base-dev qt6-base-dev-tools libqt6bluetooth6-dev
      - name: Configure and build unified native tree
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build desktop and adapters
        run: cmake --build build --target openbiounlock-desktop openbiounlock-daemon openbiounlock-pam
      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B build/packages
      - name: Build AppImage
        run: |
          curl -L --fail --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir AppDir --executable build/openbiounlock-desktop --desktop-file packaging/openbiounlock.desktop --output appimage
      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: openbiounlock-linux-desktop
          if-no-files-found: error
          path: |
            build/packages/*.deb
            OpenBioUnlock*.AppImage

  build-mobile:
    name: Analyze and build Flutter Android client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true
      - name: Generate Android runner
        working-directory: mobile
        run: flutter create --platforms=android --project-name openbiounlock .
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbiounlock-android
          if-no-files-found: error
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-windows-provider:
    name: Build Windows Credential Provider
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-cp/out | Out-Null
          cl /nologo /std:c++17 /EHsc /LD /I windows-cp windows-cp/CredentialProvider.cpp windows-cp/dllmain.cpp /link /OUT:windows-cp/out/OpenBioUnlockCredentialProvider.dll
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbiounlock-windows
          if-no-files-found: error
          path: windows-cp/out/OpenBioUnlockCredentialProvider.dll

    build-desktop-windows:
      name: Build Windows Qt desktop and MSI
      runs-on: windows-2022
      steps:
        - uses: actions/checkout@v4
        - uses: ilammy/msvc-dev-cmd@v1
          with:
            arch: x64
        - uses: jurplel/install-qt-action@v4
          with:
            version: 6.7.3
            arch: win64_msvc2022_64
            modules: qtconnectivity
            cache: true
        - name: Install OpenSSL
          shell: pwsh
          run: vcpkg install openssl:x64-windows
        - name: Configure and build unified native tree
          shell: pwsh
          run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release
        - name: Build desktop and Credential Provider
          shell: pwsh
          run: cmake --build build --config Release --target openbiounlock-desktop openbiounlock-credential-provider openbiounlock-daemon
        - name: Build MSI package
          shell: pwsh
          run: cpack --config build/CPackConfig.cmake -G WIX -B build/packages
        - name: Upload Windows desktop packages
          uses: actions/upload-artifact@v4
          with:
            name: openbiounlock-windows-desktop
            if-no-files-found: error
            path: build/packages/*.msi
